<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations: Minimal Feed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>CSS Animation Practice</h1>
    </header>

    <main class="container">
        
        <section class="task-card">
            <div class="task-info">
                <span class="step-number">01</span>
                <h2>Плавная кнопка</h2>
            </div>
            <div class="demo-area">
                <button class="task-button">Кнопка</button>
            </div>
        </section>

        <section class="task-card">
            <div class="task-info">
                <span class="step-number">02</span>
                <h2>Появление блока</h2>
            </div>
            <div class="demo-area">
                <div class="fade-box"></div>
            </div>
        </section>

        <section class="task-card">
            <div class="task-info">
                <span class="step-number">03</span>
                <h2>Движение по горизонтали</h2>
            </div>
            <div class="demo-area">
                <div class="moving-square"></div>
            </div>
        </section>

    </main>

</body>
</html>
